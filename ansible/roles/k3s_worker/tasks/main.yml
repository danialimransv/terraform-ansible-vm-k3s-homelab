---

- name: Check if K3s worker is already installed
  stat:
    path: /usr/local/bin/k3s-agent
  register: k3s_worker_binary

- name: Install K3s worker (if not installed)
  shell: |
    curl -sfL https://get.k3s.io | K3S_URL={{ k3s_url }} K3S_TOKEN={{ k3s_token }} sh -
  args:
    creates: /usr/local/bin/k3s-agent
  when: not k3s_worker_binary.stat.exists

- name: Ensure K3s agent service is running
  systemd:
    name: k3s-agent
    state: started
    enabled: yes

- name: Validate worker connection to master
  shell: "systemctl is-active k3s-agent"
  register: agent_status
  changed_when: false
  failed_when: agent_status.stdout.strip() != "active"
